name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STRGUARD_CI_FIXED_SEED_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  RUST_TOOLCHAIN: 1.94.1
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  quality:
    name: JDK ${{ matrix.java }} quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Gradle quality and plugin validation
        run: >-
          bash ./gradlew :strguard-plugin:check :strguard-plugin:validatePlugins
          --stacktrace
      - name: Rust formatting, lint, and unit tests
        if: matrix.java == 21
        run: |
          cargo fmt --manifest-path native/strguard-runtime/Cargo.toml -- --check
          cargo clippy --manifest-path native/strguard-runtime/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path native/strguard-runtime/Cargo.toml --locked
          bash .github/scripts/verify-rust-performance.sh
      - name: Rust coverage gate
        if: matrix.java == 21
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          # JNI entry points are exercised by the Native runtime TestKit jobs, outside this Rust-only profile.
          cargo llvm-cov --manifest-path native/strguard-runtime/Cargo.toml --locked \
            --fail-under-functions 38 \
            --fail-under-lines 41 \
            --fail-under-regions 43
      - name: Rust dependency audit
        if: matrix.java == 21
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file native/strguard-runtime/Cargo.lock
          cargo install cargo-deny --version 0.20.2 --locked
          cargo deny --manifest-path native/strguard-runtime/Cargo.toml check
      - name: Verify supported samples configure
        if: matrix.java == 17
        shell: bash
        run: |
          for sample in \
            java \
            java-library \
            application \
            kotlin-jvm \
            android-application \
            android-library \
            kotlin-android-application \
            kotlin-multiplatform
          do
            bash ./gradlew -p "samples/${sample}" help --stacktrace
          done

  desktop-native:
    name: ${{ matrix.name }} Native runtime
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            gradle: bash ./gradlew
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            gradle: bash ./gradlew
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            gradle: .\gradlew.bat
          - name: Windows arm64
            os: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            gradle: .\gradlew.bat
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            gradle: bash ./gradlew
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            gradle: bash ./gradlew
    env:
      STRGUARD_TARGET_TRIPLE: ${{ matrix.target }}
      STRGUARD_COMPOSE_DISTRIBUTION_TEST: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'true' || 'false' }}
      # TestKit 功能测试仅 CI 运行(本地默认跳过),见 @EnabledIfEnvironmentVariable 门控
      STRGUARD_FUNCTIONAL_TEST: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Compile, shrink, package, and load JNI runtime
        run: >-
          ${{ matrix.gradle }} :strguard-plugin:test
          --tests "io.github.weg2022.strguard.StrGuardPluginFunctionalTest"
          --tests "io.github.weg2022.strguard.JvmPluginCompatibilityTest"
          --tests "io.github.weg2022.strguard.KotlinMultiplatformPluginFunctionalTest"
          --tests "io.github.weg2022.strguard.DesktopShrinkerFunctionalTest"
          --tests "io.github.weg2022.strguard.ConfigurationFailureFunctionalTest"
          --tests "io.github.weg2022.strguard.DisabledPluginFunctionalTest"
          --tests "io.github.weg2022.strguard.NativeToolchainFailureFunctionalTest"
          --tests "io.github.weg2022.strguard.AsmIsolationFunctionalTest"
          --tests "io.github.weg2022.strguard.StrGuardBuildCacheFunctionalTest"
          --tests "io.github.weg2022.strguard.AiPolicyFunctionalTest"
          --stacktrace
      - name: Build and run public Desktop samples
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          STRGUARD_RELEASE_SEED_HEX: ${{ env.STRGUARD_CI_FIXED_SEED_HEX }}
        shell: bash
        run: |
          bash ./gradlew -p samples/java build --stacktrace
          bash ./gradlew -p samples/java-library build --stacktrace
          bash ./gradlew -p samples/application run --stacktrace
          bash ./gradlew -p samples/kotlin-jvm run --stacktrace
          bash ./gradlew -p samples/kotlin-multiplatform jvmJar --stacktrace

  android-native:
    name: Android 4 ABI packaging and R8
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STRGUARD_ANDROID_NATIVE_TEST: "true"
      # TestKit 功能测试仅 CI 运行(本地默认跳过),见 @EnabledIfEnvironmentVariable 门控
      STRGUARD_FUNCTIONAL_TEST: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK and NDK
        run: >-
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          "ndk;${ANDROID_NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Build all ABIs and verify APK/AAR/R8 contracts
        run: >-
          bash ./gradlew :strguard-plugin:test
          --tests "io.github.weg2022.strguard.KotlinAndroidPluginFunctionalTest"
          --tests "io.github.weg2022.strguard.KotlinMultiplatformPluginFunctionalTest"
          --tests "io.github.weg2022.strguard.AndroidMultiModulePackagingFunctionalTest"
          --tests "io.github.weg2022.strguard.AndroidPluginConfigurationTest"
          --stacktrace
      - name: Build public Android samples and instrumentation APK
        env:
          STRGUARD_RELEASE_SEED_HEX: ${{ env.STRGUARD_CI_FIXED_SEED_HEX }}
        shell: bash
        run: |
          bash ./gradlew -p samples/android-application assembleDebug --stacktrace
          bash ./gradlew -p samples/android-library assembleDebug --stacktrace
          bash ./gradlew -p samples/kotlin-android-application \
            assembleDebug assembleRelease assembleReleaseAndroidTest bundleRelease --stacktrace
      - name: Verify protection invariants (16 KB alignment, plaintext-free strings, stripped symbols)
        shell: bash
        run: |
          set -euo pipefail
          ndk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/${ANDROID_NDK_VERSION}"
          readelf="${ndk_root}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          apk="$(find samples/android-application/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "${apk}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          # Native 库按构建专属随机名打包（libsg_<hash>.so）
          unzip -p "${apk}" "lib/arm64-v8a/*.so" > "${tmp}/native.so"
          # Android 15+ 强制 16 KB page size：每个 LOAD 段对齐必须为 0x4000
          "${readelf}" -l "${tmp}/native.so" | awk '/LOAD/ && $NF != "0x4000" { print "LOAD alignment " $NF " is not 16 KB"; exit 1 }'
          # 编译期 XOR 混淆：协议 label、错误消息、JNI 签名不得以明文出现
          ! strings "${tmp}/native.so" | grep -q "Invalid StrGuard vault"
          ! strings "${tmp}/native.so" | grep -q "strguard/v3/record-key"
          ! strings "${tmp}/native.so" | grep -q "(JJ)Ljava/lang/String;"
          # 调试符号已剥离
          ! "${readelf}" -S "${tmp}/native.so" | grep -qE '\.symtab|\.debug_'

  reproducibility:
    name: Reproducible protected artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Compare two clean checkouts byte for byte
        env:
          STRGUARD_RELEASE_SEED_HEX: ${{ env.STRGUARD_CI_FIXED_SEED_HEX }}
        run: bash .github/scripts/verify-reproducible.sh
